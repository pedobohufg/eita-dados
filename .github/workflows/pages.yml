# EITA! DADOS no GitHub Pages: publica a raiz deste repositório a cada push no main.
# Uma vez só: Settings › Pages › Source: GitHub Actions.
# © 2026 Lab.EITA/UFG. Autor: Pedro Henrique Gonçalves. Todos os direitos reservados.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Montar o site (só os arquivos da ferramenta)
        run: |
          mkdir _site
          cp -r index.html app.js stats.js instrumentos.js dados.js graficos.js mapas.js guia.js lib assets .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: publicacao
        uses: actions/deploy-pages@v4
